name: test

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch main branch
        run: git fetch origin main

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '${{ matrix.python-version }}'

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/
          key: dot-cache-files-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            dot-cache-files-${{ runner.os }}-

      - name: Install package
        run: |
          make install-poetry
          make install

      - name: List installed packages
        run: poetry run pip freeze

      - name: Run tests with Python v${{ matrix.python-version }}
        run: make test

      - name: Run Safety and pip-audit checks
        run: |
          make safety
          python -m pip install --quiet pip-audit
          poetry export --without-hashes -f requirements.txt | pip-audit -r /dev/stdin || true

      - name: Upload coverage report
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          fail_ci_if_error: false
          verbose: true
